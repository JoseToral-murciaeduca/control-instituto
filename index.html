<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Instituto</title>
    <link rel="icon" type="image/x-icon" href="iax_logo.ico">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="container">
        <nav class="sidebar">
            <h2>Dashboard</h2>
            <div id="reloj" style="color: var(--text-main); font-size: 1.5rem; text-align: center; margin-bottom: 20px; font-weight: bold; background: var(--bg-dark); padding: 10px; border-radius: 8px; border: 1px solid #3f3f46;"></div>
    
            <ul>
                <li><a href="#" onclick="cargarVista('inicio')">Inicio</a></li>
                <li><a href="#" onclick="cargarVista('asignaturas')">Asignaturas</a></li>
                <li><a href="#" onclick="cargarVista('horario')">Horario</a></li>
                <li><a href="#" onclick="cargarVista('tests')">Zona de Test</a></li>
                <li><a href="#" onclick="cargarVista('tareas')">Mis Tareas</a></li>
            </ul>
        </nav>
    
        <main id="content" class="main-content">
        </main>
    </div>
    
    <button class="btn-floating-chat" onclick="toggleChat()">💬 Asistente IA</button>
    
    <div class="chat-popup" id="chatPopup" style="display: none;">
        <div class="chat-header">
            <h3>IA de Estudio</h3>
            <button onclick="toggleChat()" class="btn-close-chat">✖</button>
        </div>
        <div id="chatMessages" class="chat-messages">
            <div class="message ai">¡Hola! Soy tu asistente. ¿En qué te ayudo hoy?</div>
        </div>
        <div class="chat-input-group">
            <input type="text" id="chatInput" placeholder="Escribe tu duda..." onkeypress="manejarEnterChat(event)">
            <button onclick="enviarMensajeIA()" class="btn-send">▶</button>
        </div>
    </div>
    
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registrado con éxito', reg))
                    .catch(err => console.error('Error al registrar el Service Worker', err));
            });
        }
    </script>
    
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
