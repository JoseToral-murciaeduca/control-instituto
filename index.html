<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Instituto | Mi Dashboard</title>
    <!-- TailwindCSS por CDN para un diseño moderno sin compilar -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800">
<div class="flex h-screen overflow-hidden">

    <!-- Menú Lateral (Sidebar) -->
    <aside class="w-64 bg-slate-900 text-white flex flex-col shadow-xl z-10">
        <div class="p-6 border-b border-slate-800 text-center">
            <h1 class="text-xl font-bold tracking-wider">
                <i class="fa-solid fa-graduation-cap text-blue-400 mr-2"></i>CONTROL
            </h1>
            <p class="text-xs text-slate-400 mt-1">Instituto</p>
        </div>
        <nav class="flex-1 p-4 space-y-2 mt-4">
            <button onclick="cambiarSeccion('dashboard')" class="w-full text-left px-4 py-3 hover:bg-slate-800 rounded-lg transition-colors flex items-center">
                <i class="fa-solid fa-chart-line w-6 text-blue-400"></i> Resumen
            </button>
            <button onclick="cambiarSeccion('tareas')" class="w-full text-left px-4 py-3 hover:bg-slate-800 rounded-lg transition-colors flex items-center">
                <i class="fa-solid fa-list-check w-6 text-green-400"></i> Tareas y Exámenes
            </button>
            <button onclick="cambiarSeccion('horario')" class="w-full text-left px-4 py-3 hover:bg-slate-800 rounded-lg transition-colors flex items-center">
                <i class="fa-solid fa-calendar-days w-6 text-purple-400"></i> Horario
            </button>
            <button onclick="cambiarSeccion('calificaciones')" class="w-full text-left px-4 py-3 hover:bg-slate-800 rounded-lg transition-colors flex items-center">
                <i class="fa-solid fa-star w-6 text-yellow-400"></i> Calificaciones
            </button>
        </nav>
        <div class="p-4 text-xs text-slate-500 text-center border-t border-slate-800">
            <i class="fa-solid fa-hard-drive mr-1"></i> Datos locales
        </div>
    </aside>

    <!-- Área Principal -->
    <main class="flex-1 overflow-y-auto p-8 bg-slate-50">

        <!-- SECCIÓN: DASHBOARD -->
        <section id="dashboard" class="seccion-app animate-fade-in">
            <h2 class="text-3xl font-bold text-slate-800 mb-8">Hola, Estudiante 👋</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 flex items-center gap-4">
                    <div class="bg-blue-100 p-4 rounded-lg">
                        <i class="fa-solid fa-file-signature text-2xl text-blue-600"></i>
                    </div>
                    <div>
                        <h3 class="text-sm font-semibold text-slate-500 uppercase tracking-wider">Pendientes</h3>
                        <p class="text-3xl font-bold text-slate-800" id="dash-pendientes">0</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECCIÓN: TAREAS -->
        <section id="tareas" class="seccion-app hidden animate-fade-in">
            <h2 class="text-3xl font-bold text-slate-800 mb-8">Mis Tareas y Exámenes</h2>

            <!-- Formulario -->
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 mb-8">
                <form id="form-tarea" class="flex flex-col md:flex-row gap-4 items-end">
                    <div class="flex-1 w-full">
                        <label class="block text-sm font-medium text-slate-600 mb-1">¿Qué hay que hacer?</label>
                        <input type="text" id="input-tarea" required placeholder="Ej. Estudiar tema 4, Entregar práctica..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                    </div>
                    <div class="w-full md:w-1/3">
                        <label class="block text-sm font-medium text-slate-600 mb-1">Asignatura</label>
                        <input type="text" id="input-asignatura" required placeholder="Ej. Programación" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none transition">
                    </div>
                    <button type="submit" class="w-full md:w-auto bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition font-medium shadow-md">
                        <i class="fa-solid fa-plus mr-2"></i>Añadir
                    </button>
                </form>
            </div>

            <!-- Lista de tareas -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-100 overflow-hidden">
                <ul id="lista-tareas" class="divide-y divide-slate-100">
                    <!-- Las tareas se inyectan aquí con JS -->
                </ul>
            </div>
        </section>

        <!-- SECCIÓN: HORARIO -->
        <section id="horario" class="seccion-app hidden animate-fade-in">
            <h2 class="text-3xl font-bold text-slate-800 mb-8">Mi Horario</h2>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 overflow-x-auto">
                <table class="w-full border-collapse min-w-[600px]">
                    <thead>
                    <tr class="bg-slate-100 text-slate-600 uppercase text-xs tracking-wider">
                        <th class="border border-slate-200 p-3 w-16 text-center">Hora</th>
                        <th class="border border-slate-200 p-3 w-1/5 text-center">Lunes</th>
                        <th class="border border-slate-200 p-3 w-1/5 text-center">Martes</th>
                        <th class="border border-slate-200 p-3 w-1/5 text-center">Miércoles</th>
                        <th class="border border-slate-200 p-3 w-1/5 text-center">Jueves</th>
                        <th class="border border-slate-200 p-3 w-1/5 text-center">Viernes</th>
                    </tr>
                    </thead>
                    <tbody id="tabla-horario">
                    <!-- JavaScript inyectará las filas aquí -->
                    </tbody>
                </table>
            </div>

            <!-- SECCIÓN: CALIFICACIONES -->
            <section id="calificaciones" class="seccion-app hidden animate-fade-in">
                <h2 class="text-3xl font-bold text-slate-800 mb-8">Mis Calificaciones</h2>

                <!-- Formulario para nueva asignatura -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-100 mb-8">
                    <form id="form-asignatura-notas" class="flex flex-col md:flex-row gap-4 items-end">
                        <div class="flex-1 w-full">
                            <label class="block text-sm font-medium text-slate-600 mb-1">Nombre de la Asignatura</label>
                            <input type="text" id="input-nombre-asignatura" required placeholder="Ej. Acceso a Datos, Desarrollo de Interfaces..." class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-yellow-500 focus:outline-none transition">
                        </div>
                        <button type="submit" class="w-full md:w-auto bg-yellow-500 text-white px-6 py-3 rounded-lg hover:bg-yellow-600 transition font-medium shadow-md">
                            <i class="fa-solid fa-folder-plus mr-2"></i>Añadir Asignatura
                        </button>
                    </form>
                </div>

                <!-- Contenedor donde aparecerán las tarjetas de cada asignatura -->
                <div id="contenedor-asignaturas" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <!-- JS inyectará las asignaturas y sus notas aquí -->
                </div>
            </section>

            <!-- Modal Flotante para Añadir/Editar Asignatura -->
            <div id="modal-horario" class="fixed inset-0 bg-slate-900 bg-opacity-40 hidden flex items-center justify-center z-50 backdrop-blur-sm transition-opacity">
                <div class="bg-white p-6 rounded-2xl shadow-2xl w-96 max-w-[90%] transform transition-all">
                    <h3 id="modal-titulo" class="text-xl font-bold text-slate-800 mb-4">Añadir Asignatura</h3>

                    <!-- Inputs ocultos para saber qué celda estamos editando -->
                    <input type="hidden" id="modal-dia">
                    <input type="hidden" id="modal-hora">

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-slate-600 mb-1">Nombre de la Asignatura</label>
                        <input type="text" id="modal-input-asignatura" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-purple-500 focus:outline-none transition" placeholder="Ej. Bases de Datos">
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-slate-600 mb-1">Color de etiqueta</label>
                        <input type="color" id="modal-input-color" class="w-full h-12 rounded-lg cursor-pointer border-0 p-0" value="#a855f7">
                    </div>

                    <div class="flex justify-end gap-3">
                        <button type="button" onclick="eliminarCeldaHorario()" id="btn-eliminar-horario" class="hidden px-4 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 font-medium transition">Borrar</button>
                        <button type="button" onclick="cerrarModalHorario()" class="px-4 py-2 text-slate-500 bg-slate-100 rounded-lg hover:bg-slate-200 font-medium transition">Cancelar</button>
                        <button type="button" onclick="guardarCeldaHorario()" class="px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 font-medium shadow-md transition">Guardar</button>
                    </div>
                </div>
            </div>
        </section>

    </main>
</div>

<style>
    /* Pequeña animación para suavizar los cambios de pantalla */
    .animate-fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
</style>

<script src="app.js"></script>
</body>
</html>
