# Puerto en el que se levantará nuestro backend (por defecto es 8080, lo dejamos así)
server.port=8080

# Conexión a la base de datos MySQL (Apuntando al puerto 3307)
spring.datasource.url=jdbc:mysql://localhost:3307/academic_os?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
# NOTE: Do not store secrets in source control. Set DB_PASSWORD in the environment or external config.

# Magia de Hibernate (JPA): Actualiza las tablas automáticamente basándose en nuestro código Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true